name: notiq_mobile
description: Official Notiq mobile tenant application.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  signalr_netcore: ^1.4.4
  flutter_secure_storage: ^9.2.4
  go_router: ^14.8.1
  intl: ^0.20.2
